<section class="section contact" id="iletisim">
  <div class="container">
    <header class="head" reveal="none">
      <p class="eyebrow">İletişim</p>
      <h2 class="display h-lg">
        <span class="line"><span>Girişinizi</span></span>
        <span class="line"><span style="--rd: 0.12s"><span class="accent">birlikte</span> tasarlayalım.</span></span>
      </h2>
    </header>

    <div class="grid">
      <!-- Bilgiler -->
      <div class="info" reveal="left">
        <div class="block">
          <small>Adres</small>
          <p>{{ company.address }}</p>
          <a [href]="mapLink" target="_blank" rel="noopener" class="link">Yol tarifi al →</a>
        </div>
        <div class="block">
          <small>Telefon</small>
          @for (p of company.phones; track p.href) {
            <a [href]="p.href" class="big">{{ p.label }}</a>
          }
        </div>
        <div class="block">
          <small>E-posta</small>
          <a [href]="'mailto:' + company.email" class="big mail">{{ company.email }}</a>
        </div>
        <p class="legal">{{ company.legal }}</p>

        <div class="map">
          <iframe [src]="mapUrl" title="MMK Grup konum haritası" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>

      <!-- Form -->
